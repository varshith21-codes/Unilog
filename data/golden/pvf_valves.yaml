  # ------------------------------------------------- ball valves, PDF source (Apollo 77C)
  #
  # This block earns its place by testing things the two text datasheets cannot:
  #
  #   * The source is a PDF, so the ordering table has to be reconstructed from word
  #     coordinates before any row can be read.
  #   * Sizes are given as DN designations. Reading DN15 as fifteen inches is a 25x error that
  #     lands inside the plausible range and passes every downstream check.
  #   * NOTE 1 *overrides* the prose instead of contradicting it: the description says every
  #     valve ships with a lever, then the note replaces that with a tee handle for DN25 and
  #     up. So handle_type is determinable for all six SKUs, and an extractor that reads only
  #     the prose gets four of them wrong. This is the opposite case to BA-100-100, where the
  #     document genuinely contradicts itself and no answer is defensible.
  #   * Reduced-port SKUs share a nominal size with their full-port twin and differ only in
  #     Cv. Selecting the row by size instead of by catalog number returns a value that is
  #     really present in the document and wrong for the part, which quote verification cannot
  #     catch.
  #   * end_connection is never stated. Every other datasheet in this set states it, so a model
  #     that pattern-matches the category will fabricate one.
  #   * 77C-102 appears only to be declared discontinued. It must never surface as a product.
  - sku: 77C-103
    class_code: PLB.VLV.BALL.2PC
    source: ap77c
    notes: >
      operating_torque omitted from both lists: the sheet gives "between 14 and 19 ft-lb
      depending on size and seat wear; no single figure is published". That is a cross-size
      envelope, not a per-SKU spec, so recording it against this SKU would assert something
      the document declines to state. Unlike BA-100-050, where the range IS qualified to one
      size and is therefore real ground truth.
    attributes:
      product_series: 77C
      number_of_pieces: Two-Piece
      nominal_size: 1/2"
      case_quantity: "24"
      handle_type: Lever          # DN15 is below the NOTE 1 threshold, so the prose stands
      body_material: Bronze C89833
      seat_material: RPTFE
      stem_material: Silicon Bronze
      port_type: Full Port
      cv_flow_coefficient: "15.0"
      pressure_rating_wog: 400 PSI
      steam_pressure_rating: 125 PSI
      temperature_range: -20 degF to 365 degF
      approvals: NSF/ANSI 61, NSF/ANSI 372
      lead_free_compliant: "true"
      potable_water_approved: "true"
      country_of_origin: Taiwan
    absent:
      - end_connection           # never stated anywhere on the sheet
      - gtin
      - each_weight              # "available on request"
      - case_weight
      - selling_uom

  - sku: 77C-104
    class_code: PLB.VLV.BALL.2PC
    source: ap77c
    notes: operating_torque omitted for the same cross-size-envelope reason as 77C-103.
