name: axiom

services:
  api:
    # A fixed name deliberately prevents `docker compose --scale api=2`; local files
    # and the enrichment mutex are only safe with one API process/container.
    container_name: axiom-api
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
      AXIOM_SEARCH: ${AXIOM_SEARCH:-auto}
      AXIOM_BRAVE_API_KEY: ${AXIOM_BRAVE_API_KEY:-}
      AXIOM_BROWSER: ${AXIOM_BROWSER:-auto}
    volumes:
      - type: bind
        source: ${AXIOM_DATA_DIR:-./data}
        target: /app/data
    expose:
      - "8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 5m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; import urllib.request; from axiom.schema import load_default as load_schema; from axiom.delivery import load_default as load_delivery_format; load_schema(); load_delivery_format(); p=Path('/app/data/.container-write-check'); p.write_text('ok', encoding='utf-8'); p.unlink(); urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  console:
    build:
      context: ./apps/console
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AXIOM_API_URL: ${AXIOM_ORIGIN:?Set AXIOM_ORIGIN in .env.deploy}
    environment:
      AXIOM_API_URL: http://api:8000
      NODE_ENV: production
    expose:
      - "3000"
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      AXIOM_ORIGIN: ${AXIOM_ORIGIN:?Set AXIOM_ORIGIN in .env.deploy}
      AXIOM_AUTH_USER: ${AXIOM_AUTH_USER:?Set AXIOM_AUTH_USER in .env.deploy}
      AXIOM_AUTH_HASH: ${AXIOM_AUTH_HASH:?Set AXIOM_AUTH_HASH in .env.deploy}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      console:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
