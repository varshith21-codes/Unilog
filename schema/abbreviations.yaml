# Supplier abbreviations, scoped per attribute.
#
# This is the stand-in for the client's `Unilog_Master_UOM_Standards_Abbreviations_and_Terms.xlsx`
# (~500 approved abbreviations across 89 measurement types), which is not in this repository. When
# it arrives it replaces the contents of this file, not its shape: the loader reads
# (attribute, abbreviation) -> canonical value, which is exactly how that sheet is organised.
#
# ---------------------------------------------------------------------------------------------
# WHY THESE ARE SCOPED PER ATTRIBUTE, not global.
#
# "SS" means stainless steel on an appliance and it means "socket set" on a fastener. A global
# table would expand it wrongly wherever the second reading applies, and the expansion is
# irreversible — nobody downstream can tell that "Stainless Steel" was once "SS". Scoping to an
# attribute means a rule only fires for a class that binds it, so an abbreviation is only ever read
# in a context where the reading has been declared correct.
#
# The consequence to keep in mind: adding a term here is a claim that it *always* means this for
# this attribute. If a supplier uses it both ways, it does not belong in this file — it belongs in
# front of a human.
#
# ---------------------------------------------------------------------------------------------
# WHAT IS DELIBERATELY ABSENT.
#
# `SS` is mapped to `primary_material` and NOT to `finish_color`, even though the client's row 2
# carries "Stainless Steel" in both. One token cannot evidence two independent attributes: the
# description says the thing is made of stainless steel, and inferring that its *finish* is
# therefore also stainless steel is a guess that happens to be right on that row. Row 1 has the
# same "SS" and leaves Color blank, which is the counterexample. So Color stays empty and scores as
# missed rather than as invented.

# ---------------------------------------------------------------------------------------------
# INVOICE TERMS run the other way: canonical value -> short form, for the 40-character till line.
#
# A separate table rather than the inverse of the one below, because the two are not inverses. The
# reading direction has to accept every spelling a supplier might send ("SS", "S/S", "SST" all mean
# stainless steel); the writing direction must choose exactly one, and the client's rows show which:
# SST, not SS. Deriving one from the other would either produce the wrong output or force the input
# table to be lossy.
#
# Matched on the canonical value, case-insensitively, longest first.
invoice_terms:
  Stainless Steel: SST
  Black Stainless Steel: BSST
  PrintShield Stainless Steel: PSST
  Porcelain Enamel: PORC
  Built-in: BLTLN
  Built-In: BLTLN
  Free-standing: FRSTD
  Leg: LEG
  White: WHT
  Black: BLK
  Bronze: BRZ
  Chrome: CHR
  Nickel: NKL
  Stainless: STNL

abbreviations:
  # ---------------------------------------------------------------- materials
  - attribute: primary_material
    note: >
      Construction material. Read from finish/material codes suppliers append to a short
      description, e.g. "PDSH4816AF Dishwasher SS - Display Only".
    terms:
      SS: Stainless Steel
      SST: Stainless Steel
      "S/S": Stainless Steel
      BSS: Black Stainless Steel
      PSS: PrintShield Stainless Steel
      PLST: Plastic
      PORC: Porcelain Enamel
      GLS: Glass

  # ---------------------------------------------------------------- finishes
  - attribute: finish_color
    note: >
      Colourway as the manufacturer names it. Deliberately does NOT include SS/SST — see the
      header note. These are unambiguous colour words rather than material codes.
    terms:
      Wh: White
      Wht: White
      Bk: Black
      Blk: Black
      Bge: Beige
      Alm: Almond
      Bz: Bronze
      Chr: Chrome
      Nkl: Nickel
      Slvr: Silver

  # ---------------------------------------------------------------- valve vocabulary
  #
  # Included because the guide's own worked example of a cryptic description is a valve
  # ("3/8 CPLG BRS 150#") and because the valve classes are the vertical with real documents and a
  # golden set, so these are the terms this repository can actually regression-test against.
  # `body_material` is DELIBERATELY ABSENT, and it is the most instructive omission in this file.
  #
  # The obvious entries would be BRS/BRZ -> Bronze. They cannot be written, for two reasons that
  # compound. "BRS" is industrial shorthand for *brass* at least as often as for bronze. And the
  # attribute's permitted values are alloy designations — Brass C36000, Brass C46500, Brass C69300,
  # Bronze C84400, Bronze C89833 — so even the correct metal leaves a one-in-three choice between
  # alloys that differ in lead content and therefore in potable-water eligibility.
  #
  # Snapping a three-letter code onto one of them would fabricate a metallurgical claim, and
  # `lead_free_compliant` has a cross-field rule that reads exactly this attribute. The guide's own
  # cryptic example, "3/8 CPLG BRS 150#", therefore yields no material here — which is the correct
  # answer and the reason the token is still reported as refused rather than dropped.

  - attribute: end_connection
    note: >
      Unambiguous connection codes. Values match the attribute's permitted list exactly; an
      expansion that does not snap onto a permitted value is refused rather than written.
    terms:
      THRD: NPT Threaded
      THD: NPT Threaded
      NPT: NPT Threaded
      BSPT: BSPT Threaded
      SWT: Solder
      SLD: Solder
      SOL: Solder
      FLG: Flanged
      GRV: Grooved

  - attribute: port_type
    terms:
      FP: Full Port
      FB: Full Port
      RP: Reduced Port
      STD: Standard Port

  - attribute: handle_type
    terms:
      LVR: Lever
      LEV: Lever
      TEE: Tee
      HW: Handwheel

  - attribute: lead_free_compliant
    note: >
      A compliance attribute, so extraction from an abbreviation is NOT permitted to publish it
      — `evidence_requirement: strict` on the attribute refuses inference, and a three-letter code
      in a description is not a certification. Listed so the token is *recognised* and reported as
      a candidate for review rather than silently ignored.
      is_compliance_claim: true
    terms:
      LF: "true"
      "NL": "true"

  # ---------------------------------------------------------------- lighting vocabulary
  #
  # The largest cohort in the client's sample (208 of 1,000 rows) and the one whose descriptions
  # are most consistently machine-readable, because lighting suppliers abbreviate to a convention
  # rather than freely: technology, then a size, then a shape designation, then a colour
  # temperature.
  #
  #     141465  15W Flor 18" T12 27k
  #     567313  50W Led MR16 30K 3pk
  #     45573BK Kichler Wall Light
  #
  # Wattage comes out through the quantity path because it carries its own unit. Everything below
  # is an enum, and an enum can only be read from a description through this table — which is why
  # a lighting row classified but produced no technology before these entries existed.

  - attribute: lamp_technology
    note: >
      The light-producing mechanism, which lighting suppliers abbreviate consistently. Every term
      here means one technology and nothing else in any catalogue this repository has seen.

      SODIUM is the one judgement call and it is recorded rather than hidden. Bare "Sodium" is
      mapped to High Pressure Sodium because low-pressure sodium has been effectively absent from
      North American distribution for two decades, and the attribute's own permitted values
      already carry "sodium" as an alias of the high-pressure value. If a low-pressure line ever
      appears in a feed, this entry is the thing that has to be removed.
    terms:
      LED: LED
      Flor: Fluorescent
      Fluor: Fluorescent
      Fluorescent: Fluorescent
      CFL: Compact Fluorescent
      Incand: Incandescent
      Halogen: Halogen
      Hal: Halogen
      Sodium: High Pressure Sodium
      HPS: High Pressure Sodium
      MH: Metal Halide
      Halide: Metal Halide

  - attribute: luminaire_form
    note: >
      What kind of fitting it is. Safe to read only because this table is scoped per attribute and
      the attribute is bound to one class: "Wall" means a wall-mounted luminaire in a lighting row
      and would mean something else entirely on a building product, which is exactly the situation
      the per-attribute scoping exists for.

      DELIBERATELY ABSENT: "Retro". It appears in rows like "10w LED 6\" Retro 50k" where it does
      mean a recessed downlight retrofit, but the word on its own only says "retrofit" — it is
      equally the name for a replacement lamp that fits an existing fixture. One token cannot
      decide between a fitting and a bulb, so the form stays empty on those rows.
    terms:
      Pendant: Pendant
      Pend: Pendant
      Chandelier: Chandelier
      Chand: Chandelier
      Ceiling: Ceiling Mount
      Sconce: Wall Mount
      Wall: Wall Mount
      Bath: Bath Bar
      Vanity: Bath Bar
      Downlight: Recessed Downlight
      Troffer: Troffer
      Highbay: High Bay
      Strip: Strip Light
      Undercabinet: Under Cabinet
      Floodlight: Flood

  - attribute: lamp_shape
    note: >
      ANSI envelope designations. These are not abbreviations of anything — the designation IS the
      value — but the description path reaches an enum only through this table, so each is listed
      as its own expansion. The letter names the profile and the number is the maximum diameter in
      eighths of an inch, so the strings are unambiguous wherever they appear as a whole token.
    terms:
      A15: A15
      A19: A19
      A21: A21
      BR30: BR30
      BR40: BR40
      PAR16: PAR16
      PAR20: PAR20
      PAR30: PAR30
      PAR38: PAR38
      MR11: MR11
      MR16: MR16
      T3: T3
      T4: T4
      T5: T5
      T8: T8
      T9: T9
      T12: T12
      G25: G25
      B11: B11

  - attribute: lamp_base
    note: >
      Socket caps. "Med" and "Cand" are the two a supplier actually shortens; the rest are already
      the standard designation. Deliberately excludes a bare "E" prefix guess and excludes "Pin",
      which appears in rows like "20W Halogen Pin T4" but names a family of bi-pin caps with
      different pin spacings rather than one of them.
    terms:
      Med: Medium E26
      Medium: Medium E26
      E26: Medium E26
      Cand: Candelabra E12
      E12: Candelabra E12
      E17: Intermediate E17
      Mog: Mogul E39
      E39: Mogul E39
      GU10: GU10
      GU24: GU24
      G13: G13
  # ================================================================================================
  # WHOLE-CATALOGUE VOCABULARY
  #
  # Added when the taxonomy grew from four classes to thirty-two. Everything below follows the same
  # rule as the entries above: an entry here is a claim that the term ALWAYS means this value for
  # THIS attribute. Where a term means two things, it is left out and the cell stays empty, because
  # an empty cell scores as missed and a wrong one scores as correct until someone checks by hand.
  #
  # ONE MECHANIC WORTH KNOWING BEFORE EDITING. A span of the description can be claimed by only one
  # attribute, and attributes are tried in the order the class binds them. On "Metal Cut Off Disc"
  # the operation and the form are the same three words, so whichever is bound first takes them and
  # the other stays blank. That is why `abrasive_form` carries only terms that do NOT overlap an
  # operation word, and why the bonded-wheel class binds the operation first.
  # ================================================================================================

  # ---------------------------------------------------------------- abrasives
  - attribute: abrasive_operation
    note: >
      What the abrasive is built to do. Cutting and grinding wheels are not interchangeable and the
      difference is a safety matter rather than a preference, so these are the highest-value terms
      in the abrasive cohort. "Cut and Grind" is listed ahead of nothing in particular — the matcher
      tries longest first, so the dual rating wins over the bare "Cut Off" it contains.
    terms:
      Cut Off: Cutting
      Cut-Off: Cutting
      Cutoff: Cutting
      Cut and Grind: Cutting and Grinding
      Cut n Grind: Cutting and Grinding
      Grinding: Grinding
      Sanding: Sanding
      Polishing: Polishing
      Deburring: Deburring

  - attribute: abrasive_form
    note: >
      DELIBERATELY OMITS the bare words "Disc" and "Wheel", which are the two most common form words
      in this cohort. Within bonded abrasives a "Disc" is a cut-off wheel or a grinding wheel
      depending entirely on the operation, so the token alone cannot choose between two permitted
      values — and choosing wrongly would put a thin cutting wheel on a listing that invites side
      loading. Only forms that name themselves unambiguously are here.
    terms:
      Sanding Belt: Belt
      Sanding Sponge: Sanding Sponge
      Sanding Sheet: Sheet
      Flap Disc: Flap Disc
      Flap Wheel: Flap Disc
      Wire Wheel: Wire Wheel
      Wire Brush: Wire Wheel
      Belt: Belt
      Sponge: Sanding Sponge

  - attribute: abrasive_grit
    note: >
      Grit designations, P-prefixed only. The FEPA "P" forms are listed and the bare ANSI numbers
      are NOT, because a bare number in these descriptions is far more often a dimension than a
      grit: "5B-332-080 HIOLIT 5\" P80" carries both, and "080" is part of the part number. The
      trailing-word forms are safe because "Grit" disambiguates them.
    terms:
      P80: P80
      P100: P100
      P120: P120
      P150: P150
      P180: P180
      P220: P220
      P240: P240
      P320: P320
      P400: P400
      "80 Grit": "80"
      "120 Grit": "120"
      "150 Grit": "150"
      "180 Grit": "180"
      "220 Grit": "220"
      "320 Grit": "320"

  - attribute: abrasive_grain
    note: >
      The mineral. Brand lines are included only where the line names exactly one grain: Cubitron is
      3M's precision-shaped ceramic and nothing else. HIOLIT and Abranet are deliberately absent —
      both are product lines sold in several grains.
    terms:
      Cubitron II: Ceramic Aluminum Oxide
      Cubitron: Ceramic Aluminum Oxide
      Zirconia: Zirconia Alumina
      Ceramic: Ceramic Aluminum Oxide
      Diamond: Diamond
      Garnet: Garnet
      Emery: Emery

  - attribute: attachment_type
    terms:
      Stikit: PSA (Stikit)
      Hookit: Hook and Loop
      Roloc: Quick Change
      Hook and Loop: Hook and Loop

  - attribute: backing_material
    terms:
      Film: Film
      Cloth: Cloth
      Mesh: Mesh
      Fiber: Fiber
      Non-Woven: Non-Woven

  - attribute: workpiece_material
    note: >
      What the consumable is rated to work on. "Masonry" maps to the combined Concrete / Masonry
      value, which is the enum's own spelling — this is the term that, as an identity guard on the
      mortar class, wrongly won six Milwaukee masonry cut-off discs. As an ATTRIBUTE reading on an
      abrasive it is exactly right, which is the distinction between identity and specification.
    terms:
      Stainless Steel: Stainless Steel
      Stainless: Stainless Steel
      Masonry: Concrete / Masonry
      Concrete: Concrete / Masonry
      Metal: Metal
      Aluminum: Aluminum
      Wood: Wood
      Tile: Tile
      Drywall: Drywall

  # ---------------------------------------------------------------- tools
  - attribute: tool_configuration
    note: >
      What is in the box, and the single most commercially consequential reading in the tool cohort:
      the same tool bare and as a kit differ by roughly 3x in price. The bare forms are listed in
      every spelling the suppliers use, because a missed "Tool - Only" prices a battery and charger
      into a listing that has neither.
    terms:
      Tool - Only: Bare Tool
      Tool Only: Bare Tool
      Bare Tool: Bare Tool
      Bare: Bare Tool
      Combo Kit: Combo Kit
      Starter Kit: Starter Kit
      Kit: Kit

  - attribute: power_source
    terms:
      Cordless: Cordless (Battery)
      Corded: Corded Electric
      Pneumatic: Pneumatic
      Hydraulic: Hydraulic

  - attribute: battery_platform
    note: >
      DELIBERATELY OMITS bare voltage forms such as "18V" and "20V". They are read by the quantity
      path into `battery_voltage`, and because a span can only be claimed once, listing them here
      would steal the figure from the attribute that measures it — leaving a platform string where a
      comparable voltage should be. Only the proprietary names are here, and they are not voltages.
    terms:
      M18: M18
      M12: M12
      LXT: 18V LXT
      Packout: M18

  - attribute: bit_tip_type
    note: >
      The recess a driver bit engages, and the field where an error destroys the fastener. "Trox" is
      a supplier misspelling of Torx in "DT252B 2\" #25 Trox Drive Bit"; the part-number prefix DT
      confirms the intent, so it is an alias rather than a guess.
    terms:
      Phillips: Phillips
      Robertson: Square (Robertson)
      Square: Square (Robertson)
      Torx Plus: Torx Plus
      Torx: Torx
      Trox: Torx
      Slotted: Slotted
      Nut Setter: Nut Setter
      Nut Driver: Nut Setter

  - attribute: bit_tip_size
    note: >
      Size designator within the tip family, kept as written. Only the hash forms are listed: a bare
      number beside them is the bit LENGTH, and in '2" #2 Phillips' the two figures are adjacent and
      differ only by their prefix.
    terms:
      "#1": "#1"
      "#2": "#2"
      "#3": "#3"
      "#10": "#10"
      "#15": "#15"
      "#20": "#20"
      "#25": "#25"
      "#30": "#30"
      "#40": "#40"

  - attribute: shank_type
    terms:
      SDS-Plus: SDS-Plus
      SDS Plus: SDS-Plus
      SDS-Max: SDS-Max
      Quik-Lock: Quick Change
      Quick Change: Quick Change
      Impact: Impact Hex

  - attribute: blade_material
    terms:
      Carbide: Carbide-Tipped
      Bi-Metal: Bi-Metal
      Bimetal: Bi-Metal
      HSS: High Speed Steel
      Diamond: Diamond

  - attribute: graduation_system
    note: >
      Which unit system the tool is marked in. The reason this matters is that the same square is
      stocked in both under part numbers differing by one digit, and 300 mm and 12 inches are the
      same length — so the marking has to be read rather than inferred from the figure.
    terms:
      Metric: Metric
      SAE: Imperial
      Imperial: Imperial

  # ---------------------------------------------------------------- building products
  - attribute: edge_profile
    note: >
      How the long edges are machined, which decides the fastening system: a grooved board takes
      hidden fasteners and a square-edge board must be face-screwed.
    terms:
      Sq Edge: Square Edge
      Square Edge: Square Edge
      No-Groove: Square Edge
      Grooved: Grooved
      Fascia: Fascia
      Shiplap: Shiplap
      T&G: Tongue and Groove

  - attribute: material_composition
    note: >
      DELIBERATELY OMITS "Composite" as a bare word for the capped value. AZEK and Trex both sell
      capped and uncapped lines and the word alone does not say which, so it is listed only in the
      capped form where the supplier writes it out. "Cedar" is here as a MATERIAL and absent from
      `surface_texture`, where it would equally plausibly mean the embossed pattern — one token
      cannot evidence both.
    terms:
      Capped Composite: Capped Wood-Plastic Composite
      PVC: Cellular PVC
      Doug Fir: Douglas Fir
      Drywall: Gypsum
      Gypsum: Gypsum
      OSB: Engineered Wood
      Cedar: Cedar
      Alum: Aluminum
      Aluminum: Aluminum

  - attribute: surface_texture
    terms:
      Smooth: Smooth
      Wood Grain: Wood Grain
      Brushed: Brushed
      Variegated: Variegated

  - attribute: railing_component
    note: >
      Which part of a railing assembly the item is. A railing order is a bill of parts that are
      never alternatives to each other, so this is the identity of the line. "T-Rail" is the
      supplier's compound for a top rail and is matched whole.
    terms:
      Support Post: Support Post
      Blank Post: Support Post
      Post Sleeve: Post Sleeve
      Post Wrap: Post Sleeve
      Post Trim: Post Trim
      Post Cap: Post Cap
      Rail Kit: Rail Kit
      T-Rail: Top Rail
      Handrail: Top Rail
      Baluster: Baluster
      Balusters: Baluster
      End Cap: End Cap
      Gravity Latch: Gate Hardware

  - attribute: roofing_component
    terms:
      Ice Guard: Ice and Water Shield
      Eaveguard: Ice and Water Shield
      Weathr Lk: Ice and Water Shield
      Ridge Vent: Ridge Vent
      Starter Strip: Starter Strip
      Shingle: Architectural Shingle
      Rib: Metal Panel

  - attribute: fire_rating
    terms:
      Type X: Type X
      Type C: Type C

  - attribute: glazing_package
    note: >
      "Arg" is argon fill and "LowE" the coating; both appear on United's gliding patio doors. The
      trailing "-2" on LowE-2 names a specific coating generation the enum does not distinguish, so
      both spellings map to the same value rather than inventing a value for one of them.
    terms:
      LowE-2: Low-E
      Low-E2: Low-E
      LowE: Low-E
      Low-E: Low-E
      Argon: Argon Filled
      Arg: Argon Filled
      Tempered: Tempered
      Laminated: Laminated

  - attribute: handing
    note: >
      Which way a door is hung, and the most expensive ordering error in the category because the
      opening is cut before the mistake is found.

      DELIBERATELY OMITS the bare trailing letters of a size code. "6068R" and "6068L" are the real
      carriers of handing in this catalogue, and they tokenise whole — a single "R" or "L" pattern
      would fire on any word ending in one. So those rows produce no handing, the class's cross-field
      rule reports it, and the gap is visible rather than guessed.
    terms:
      Reversible: Reversible
      Left Hand: Left
      Right Hand: Right
      LH: Left
      RH: Right

  # ---------------------------------------------------------------- electrical
  - attribute: wiring_device_type
    note: >
      "Outet" is a supplier misspelling of outlet in "R2005378P00 6-50R Welder Outet", confirmed by
      the NEMA code on the same row.
    terms:
      GFCI: GFCI Receptacle
      GFI: GFCI Receptacle
      Decor Plate: Wall Plate
      Wallplate: Wall Plate
      Wall Plate: Wall Plate
      Cord Conn: Cord Connector
      Cord Grip: Cord Grip
      Wall Tap: Wall Tap
      Receptacle: Receptacle
      Dimmer: Dimmer
      Timer: Timer
      Outlet: Receptacle
      Outet: Receptacle
      Switch: Switch
      Plug: Plug

  - attribute: enclosure_form
    terms:
      Load Center: Load Center
      Load Cntr: Load Center
      Load Cnt: Load Center
      Box Cover: Box Cover
      Square Box: Square Box
      Oct Box: Octagon Box
      Junction Box: Junction Box

  - attribute: conductor_material
    terms:
      Aluminum: Aluminum
      Alum: Aluminum
      Copper: Copper

  - attribute: cable_type
    terms:
      Entrance Cable: Service Entrance
      SO Cord: SO Cord
      SJEWA: SJ Cord
      Triplex: Triplex
      CAT5E: CAT5e
      CAT6: CAT6
      Romex: NM-B
      THHN: THHN
      CL3: Speaker / Control

  - attribute: wire_gauge
    note: >
      The exact designations present in this feed, listed individually rather than parsed. Three
      grammars share this column — "12-4" is 12 AWG with four conductors, "16/3" is 16 AWG with
      three, and "4/0" is ONE conductor four sizes above 1 AWG — so a positional parse would read
      4/0 as four conductors of gauge zero, which is not a wire that exists.
    terms:
      "2/2/4": "2/2/4"
      "6/6/6": "6/6/6"
      "16/3": "16/3"
      "4/0": "4/0"
      "12-4": "12-4"
      "10-4": "10-4"
      "16-2": "16-2"

  # ---------------------------------------------------------------- appliances
  - attribute: fuel_type
    note: >
      A hard installation fact: gas needs a gas line and electric needs a 240 V circuit, and neither
      installation accepts the other appliance. Speed Queen dryers differ by ONE LETTER of the part
      number between the two, which is why these terms carry more weight than their brevity suggests.
    terms:
      Dual Fuel: Dual Fuel
      Induction: Induction
      Electric: Electric
      Elect: Electric
      Elec: Electric
      Propane: Gas (Propane)
      Gas: Gas (Natural)

  - attribute: door_configuration
    note: >
      DELIBERATELY OMITS "OTR". It means over-the-range, which is a MOUNTING and belongs in
      `mounting_type`; reading it as a door style would put a wall-mount microwave's installation
      requirement into a field an installer does not check.
    terms:
      French Door: French Door
      Side by Side: Side-by-Side
      Side-by-Side: Side-by-Side
      Top Freezer: Top Freezer
      Bottom Freezer: Bottom Freezer
      Upright: Upright
      Chest: Chest
      Drawer: Drawer

  # ---------------------------------------------------------------- safety and PPE
  - attribute: ppe_form
    note: >
      "Liners" makes it a glove LINER rather than a glove, and the two are worn together rather than
      instead of each other — a listing that conflates them ships an order missing one of the pair.
      Listed longest-first-safe: the liner forms contain the word glove and win over it.
    terms:
      Glove Liners: Glove Liner
      Glove Liner: Glove Liner
      Safety Glasses: Safety Glasses
      Kneeling Pad: Knee Pad
      Face Shield: Face Shield
      Goggles: Goggles
      Goggle: Goggles
      Hoodie: Hoodie
      Jacket: Jacket
      Glove: Glove
      Vest: Vest

  - attribute: garment_size
    note: >
      Apparel size, which in this cohort IS the SKU: one glove ships as six part numbers differing
      only by a trailing size token.

      THE SINGLE LETTERS ARE THE RISK AND THEY ARE INCLUDED DELIBERATELY. "M701B-21L Milw L Black
      Heated Work Glove Liners" carries the size as a standalone "L", so without it the whole
      Milwaukee heated range loses its size. They are safe here for two compounding reasons: the
      matcher requires a whole-token match, so the "M" in "M12" and "M18" cannot fire; and this
      table is scoped per attribute, so these rules only run for the two classes that bind
      `garment_size`. Neither reason holds on its own, which is why both are stated.
    terms:
      One Size: One Size
      XS: XS
      SM: S
      MD: M
      LG: L
      XL: XL
      2X: 2XL
      3X: 3XL
      S: S
      M: M
      L: L

  - attribute: heated_garment
    note: >
      Whether the garment contains a powered heating element. A category rather than a feature: a
      heated garment needs a battery and a platform and costs several times the unheated equivalent.
      Absence of the word is not evidence of false, so only the true form is listed.
    terms:
      Heated: "true"

  - attribute: lens_treatment
    terms:
      Photochromic: Photochromic
      Polarized: Polarized
      Indoor/Outdoor: Indoor / Outdoor
      Mirror: Mirror
      Smoke: Smoke / Gray
      Amber: Amber
      Clear: Clear

  - attribute: detection_type
    note: >
      What an alarm senses. "CO" is carbon monoxide in this context and nothing else — it is scoped
      to an attribute bound only by the life-safety class, which is the only place the reading is
      safe. Understating a combination alarm as single-sensor is the one gap in this schema that
      could contribute to physical harm rather than to a bad purchase.
    terms:
      Carbon Monoxide: Carbon Monoxide
      Natural Gas: Natural Gas
      Smoke: Smoke
      Motion: Motion
      CO: Carbon Monoxide

  # ---------------------------------------------------------------- fasteners
  - attribute: fastener_type
    note: >
      "BB" is Senco's code for a collated stick nail and is the only category token on those rows.
      It is a two-character term, which normally makes a rule promiscuous; it is safe here because
      the match is whole-token and part numbers tokenise whole, and because this attribute is bound
      by one class.
    terms:
      Hidden Fastener: Hidden Deck Fastener
      Self-Drilling: Self-Drilling Screw
      Deck Screw: Deck Screw
      Wood Screw: Wood Screw
      Lag Screw: Lag Screw
      Collated: Nail (Collated)
      Anchor: Anchor
      Staple: Staple
      Rivet: Rivet
      Brad: Brad
      BB: Nail (Collated)

  - attribute: fastener_finish
    note: >
      A warranty and code matter rather than an appearance one: an electro-galvanised fastener in
      treated lumber corrodes fast enough to void a deck warranty.

      "SM" is Senco's smooth-shank code and maps to Bright / Plain, which is what a smooth bright
      nail is. DELIBERATELY OMITS "SS": the enum distinguishes 304 from 316 stainless, they differ
      in marine corrosion resistance, and a two-letter code cannot choose between them.
    terms:
      Hot-Dip Galvanized: Hot-Dip Galvanized
      Mechanically Galvanized: Mechanically Galvanized
      Polymer Coated: Polymer Coated
      HDG: Hot-Dip Galvanized
      EG: Electro-Galvanized
      SM: Bright / Plain
