# Where product data may be read from, and where it may not.
#
# Declarative for the same reason `constants.yaml` is: which sites are marketplaces and which
# domain belongs to which manufacturer are *domain facts*, and burying them in a Python set puts a
# domain fact where no domain expert will ever find it. A merchandiser can correct this file; they
# will not correct a frozenset in a module.
#
# Three things live here, matching the three rules retrieval follows:
#
#   1. `manufacturers` — the primary and preferred source. The manufacturer's own site is the only
#      place a specification is authoritative rather than transcribed.
#   2. `excluded`      — sites that must never be fetched or cited, whatever they contain.
#   3. `spec_hints`    — path fragments that suggest a page is a specification rather than a
#      landing page, used to rank candidates.
#
# ---------------------------------------------------------------------------------------------
# WHY EXCLUDE E-COMMERCE, when a marketplace listing often has more specifications on one page
# than the manufacturer's own site?
#
# Because a marketplace listing is a *transcription* by a party with an incentive to make the
# product look complete, and it is not correctable. Three failure modes, all of which this system
# is specifically built to avoid:
#
#   * **Laundered provenance.** A retailer's spec table is itself unsourced. Citing it produces an
#     evidence chain that terminates in someone else's guess, while looking exactly like a citation
#     that terminates in the manufacturer's engineering drawing.
#   * **Variant bleed.** A listing routinely covers a family under one URL, with the wrong size's
#     torque figure or the wrong finish beside the part number the buyer typed. Extraction would
#     verify the quote perfectly and attribute it to the wrong product — the failure mode measured
#     at 39 fabrications in `scripts/run_adversarial.py`, arriving through a citation that checks
#     out.
#   * **Circularity.** Distributors syndicate each other's data. Enriching from a distributor risks
#     reading back a value this system published, and scoring it as independent corroboration.
#
# Distributor sites are excluded on the same reasoning and not because they are competitors. The
# client's own sourcing rule in the solution guide says the same thing, and the delivery format
# encodes it: `MFR URL` means the manufacturer's page, so a URL that is not the manufacturer's does
# not belong in the column.
#
# `unknown` is a third state and it is not a synonym for either. An unrecognised host is fetchable
# but is never promoted to `MFR URL`, and the certificate records the tier it came from. Refusing
# every host not on a list would make the open web unreachable; promoting one would make the
# citation a lie.

version: 1

policy:
  # Tiers, best first. `manufacturer` is authoritative; `unknown` is usable evidence that is
  # honestly labelled; `excluded` is never fetched.
  tiers: [manufacturer, unknown, excluded]
  refuse: [excluded]
  # Only a manufacturer-tier URL may be written to the delivery format's `MFR URL` column.
  mfr_url_tiers: [manufacturer]
  # Politeness, applied per registrable domain by the orchestrator. Not a rate limit imposed on us
  # by anyone — it is the minimum courtesy owed to a site we are reading without being asked.
  min_seconds_between_requests: 2.0
  respect_robots_txt: true
  max_candidates_per_sku: 4

# -------------------------------------------------------------------------------- excluded hosts
#
# Matched on the *registrable domain* and any subdomain of it, never as a substring. `amazon.com`
# must not match `notamazon.com`, and `www.amazon.com` and `smile.amazon.com` must both match.
#
# Not exhaustive, and it cannot be. It exists so the common cases are refused by policy rather than
# by whoever is reviewing the output that day, and so that adding one is a one-line change a
# merchandiser can make.

excluded:
  - category: marketplace
    reason: >
      Third-party sellers write their own listings. There is no single party responsible for the
      specification, so there is nothing to cite and nobody to correct.
    domains:
      - amazon.com
      - amazon.ca
      - amazon.co.uk
      - ebay.com
      - aliexpress.com
      - alibaba.com
      - temu.com
      - wish.com
      - etsy.com
      - walmart.com
      - newegg.com
      - overstock.com
      - wayfair.com
      - houzz.com

  - category: mass_retail
    reason: >
      Retail product pages are merchandising copy. They omit the specifications a distributor
      needs, round the ones they keep, and change without notice or revision marker.
    domains:
      - homedepot.com
      - lowes.com
      - menards.com
      - acehardware.com
      - truevalue.com
      - doitbest.com
      - target.com
      - costco.com
      - samsclub.com
      - bestbuy.com
      - harborfreight.com
      - northerntool.com
      - tractorsupply.com

  - category: industrial_distributor
    reason: >
      Distributors syndicate each other's product data, so reading one risks reading back a value
      this system published and scoring it as independent corroboration. This is also the category
      the client's own sourcing rule names.
    domains:
      - grainger.com
      - mscdirect.com
      - fastenal.com
      - zoro.com
      - mcmaster.com
      - globalindustrial.com
      - ferguson.com
      - supplyhouse.com
      - pexuniverse.com
      - wesco.com
      - graybar.com
      - platt.com
      - build.com
      - acmetools.com
      - toolnut.com
      - ohiopowertool.com
      - cpotools.com
      - toolbarn.com
      - 1000bulbs.com
      - bulbs.com
      - lightingdirect.com
      - ajmadison.com
      - abt.com
      - appliancesconnection.com
      - us-appliance.com

  - category: aggregator
    reason: >
      Datasheet aggregators host copies whose provenance and revision are unknown, frequently
      years stale, and often OCR'd. A citation into one cannot be checked against the
      manufacturer's current document.
    domains:
      - octopart.com
      - findchips.com
      - alldatasheet.com
      - datasheets.com
      - datasheetarchive.com
      - manualslib.com
      - manualsonline.com
      - arrow.com
      - digikey.com
      - mouser.com
      - newark.com

  - category: social_and_ugc
    reason: >
      User-generated content is not a specification source under any circumstances, and a quote
      lifted from one would verify perfectly while being someone's recollection.
    domains:
      - reddit.com
      - facebook.com
      - instagram.com
      - pinterest.com
      - youtube.com
      - twitter.com
      - x.com
      - tiktok.com
      - quora.com
      - linkedin.com

  - category: reference
    reason: >
      Encyclopaedic and editorial sources are secondary by construction. Useful for orientation,
      never citable as the manufacturer's stated specification.
    domains:
      - wikipedia.org
      - consumerreports.org
      - cnet.com
      - nytimes.com

# --------------------------------------------------------------------------------- spec hints
#
# Used only to rank candidates, never to decide whether a page is fetchable. A URL carrying one of
# these is more likely to be a specification than a category listing, which matters when the
# per-SKU candidate budget is four.

spec_hints:
  paths:
    - /spec
    - /specification
    - /datasheet
    - /data-sheet
    - /tech
    - /technical
    - /literature
    - /documents
    - /document
    - /downloads
    - /download
    - /support
    - /product
    - /products
    - /catalog
    - /manual
    - /submittal
    - /pdf
  suffixes:
    - .pdf
  # A path fragment that means "buy" rather than "specify". Deprioritised even on a
  # manufacturer's own site, because a manufacturer's shop page is retail copy like any other.
  negative_paths:
    - /cart
    - /checkout
    - /buy
    - /shop
    - /store
    - /where-to-buy
    - /dealer
    - /login
    - /account
    - /search

# ------------------------------------------------------------------------------- manufacturers
#
# Keyed three ways because the item master identifies a manufacturer three different ways and none
# of them alone is sufficient:
#
#   * `vendor_codes` — Unilog's own code from `Part_Manuf`, e.g. `5831`, `KICLI`. The most reliable
#     key available: exact, stable, and unaffected by how the name is spelled that day.
#   * `vendors`      — the `Part_Manuf` name, fold-matched. Carries the spelling the file actually
#     uses, misspellings included: the sample says "Phillips Lighting" for Philips and
#     "Black & Decker/dewlt" for DEWALT.
#   * `brands`       — the value from the brand columns, fold-matched. **This is the only key that
#     works for the distributor rows**, which are 222 of 1,000: when `Part_Manuf` is
#     "Boise Cascade Building Materials" or "Parksite", the manufacturer is identifiable only from
#     `DIB_Brand` — TREX, TIMBERTECH. Those two brands alone are 177 rows.
#
# Entries are only listed where the official domain is *known*. A guessed domain is worse than an
# absent one: it would be fetched, would 404 or land on a squatter, and the failure would look like
# a retrieval bug rather than a missing fact. An unlisted manufacturer resolves to
# "no manufacturer domain known", which is a reportable, fixable state — see
# `scripts/retrieve_sources.py --report-unresolved`.
#
# `patterns` is the optional fourth key: a URL template taking `{mpn}` (also `{mpn_lower}`,
# `{mpn_stripped}`, `{mpn_stripped_lower}`) for sites whose product URL shape is known. **No entry
# below declares one**, deliberately — establishing a site's URL shape means checking it against a
# real part, and a guessed template produces a confident 404 on every row of that brand. Fill one in
# once verified and the resolver will use it without a search provider:
#
#   - id: example
#     domains: [example.com]
#     patterns: ["https://www.example.com/products/{mpn_lower}"]

