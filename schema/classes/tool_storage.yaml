# Tool storage: organisers, tool boxes and modular cases.
#
# Six rows of the client's 1,000-row sample — three Toughsystem-style organisers and the Milwaukee
# Packout range.
#
# A SMALL BUT COHERENT COHORT, which is the test applied throughout this schema for whether a group
# earns a class. These six share a specification: an internal volume, an external size, a material,
# and whether they stack with a modular system. A buyer filters them the same way. Compare the ten
# rows this schema leaves unclassified — a heater kit, a water bottle, a phone holster, hex spikes,
# grip tape — which share nothing, and which a class could only absorb by being defined on generic
# vocabulary that would then win rows belonging to real classes.
#
# WHAT IS NOT CAPTURED, and why it stays blank. `T-90043 Deep Medium Organizer` states a depth class
# and a size class in words rather than figures, and there is no labelled row anywhere in this
# repository that says what "Deep" or "Medium" measure. They are carried verbatim in
# `product_series` rather than converted into `overall_size`, because a dimension invented from an
# adjective is worse than an empty dimension cell.
#
# No description recipe and no external scheme mapping — see decking_board.yaml.

class:
  code: TOL.STG.GEN
  name: Tool Storage
  version: v1

  item_type: Tool Storage

  identity_terms: [organizer, organiser, packout, toolbox, tote, chest, cabinet]

  browse_path:
    - Tools & Consumables
    - Tool Storage
    - Organisers & Boxes

  reporting_path: [Tools, Storage, Organisers & Boxes]

  attributes:
    - { code: product_series,        requirement: required,    weight: 3.0, label: Series }
    - { code: overall_size,          requirement: recommended, weight: 3.0, label: Size }
    - { code: primary_material,      requirement: recommended, weight: 2.0, label: Material }
    - { code: finish_color,          requirement: optional,    weight: 1.0, label: Color }
    - { code: pack_quantity,         requirement: optional,    weight: 1.0 }
    - { code: each_weight,           requirement: optional,    weight: 1.0 }
    - { code: selling_uom,           requirement: recommended, weight: 2.0 }
    - { code: additional_information, requirement: recommended, weight: 2.0 }

    # --- named delivery columns; must stay last ----------------------------------------------
    - { code: warranty_terms,        requirement: recommended, weight: 2.0 }
    - { code: approvals,             requirement: optional,    weight: 1.0 }
    - { code: country_of_origin,     requirement: optional,    weight: 1.0 }
    - { code: gtin,                  requirement: optional,    weight: 1.0 }

  cross_field_rules:
    - id: R_MODULAR_STORAGE_NAMES_ITS_SERIES
      expr: "product_series is not null"
      references: [product_series]
      severity: error
      message: >
        No product series was captured. Modular storage only stacks within its own system, so the
        series name is the compatibility fact — the same role the battery platform plays on a
        cordless tool — and a box listed without it cannot be matched to what the buyer owns.

  channel_profiles:
    - name: unilog_delivery
      title_template: "{brand} {product_series} {mpn} {class_name}"
      max_title_chars: 200
      unit_system: imperial_primary
      required: [mpn]
