# Roofing: shingles, metal panels, underlayment and ice-and-water shield.
#
# 11 rows of the client's 1,000-row sample, across Owens Corning Duration, Premier Rib XL metal
# panel, and Henry Eaveguard / OC WeatherLock membranes.
#
# THE COVERAGE PROBLEM this class is shaped around. Roofing is the one cohort in this catalogue
# where the unit of sale is meaningless on its own: "OC Duration TruDef Wburg Gray (BDL)" is a
# BUNDLE and "Ice Guard OC Weathr Lk Mat 2sq" is TWO SQUARES, and a bundle is a third of a square
# except when it is not. An estimator orders against area, so `coverage_area` is bound as a
# recommended attribute and `selling_uom` is required — the pair is what makes a roofing line
# orderable, and either alone is a trap.
#
# No description recipe and no external scheme mapping — see decking_board.yaml.

class:
  code: BLD.ROOF.GEN
  name: Roofing Product
  version: v1

  item_type: Roofing

  # "ice" is included for the ice-and-water membranes, which name the product category only as
  # "Ice Guard". "rib" catches the ribbed metal panel line, whose description never says roofing
  # or panel. "duration" is Owens Corning's shingle line, present for the same reason the decking
  # class carries "lineage".
  identity_terms:
    [roofing, roof, shingle, shingles, eaveguard, rib, ridge, underlayment, duration, ice,
     soffit, flashing]

  browse_path:
    - Building Materials
    - Roofing
    - Roofing Products

  reporting_path: [Building Materials, Roofing, Roofing Products]

  attributes:
    - { code: roofing_component,     requirement: required,    weight: 3.0, label: Component }
    - { code: product_series,        requirement: recommended, weight: 3.0, label: Series }
    - { code: material_composition,  requirement: recommended, weight: 2.0, label: Material }
    - { code: finish_color,          requirement: required,    weight: 3.0, label: Color }
    - { code: coverage_area,         requirement: recommended, weight: 3.0, label: Coverage }
    - { code: nominal_dimensions,    requirement: optional,    weight: 1.0, label: Nominal Size }
    - { code: nominal_length,        requirement: optional,    weight: 1.0, label: Length }
    - { code: fire_rating,           requirement: recommended, weight: 2.0 }
    - { code: selling_uom,           requirement: required,    weight: 3.0 }
    - { code: each_weight,           requirement: optional,    weight: 1.0 }
    - { code: additional_information, requirement: optional,   weight: 1.0 }

    # --- named delivery columns; must stay last ----------------------------------------------
    - { code: warranty_terms,        requirement: recommended, weight: 2.0 }
    - { code: approvals,             requirement: recommended, weight: 2.0 }
    - { code: country_of_origin,     requirement: optional,    weight: 1.0 }
    - { code: gtin,                  requirement: optional,    weight: 1.0 }

  cross_field_rules:
    - id: R_COVERAGE_NEEDS_A_UNIT
      expr: "coverage_area is null or selling_uom is not null"
      references: [coverage_area, selling_uom]
      severity: error
      message: >
        A coverage area was captured with no selling unit. In roofing that pairing is what makes
        the line orderable: a bundle, a square and a roll all state a coverage and mean different
        quantities, so the figure alone will be ordered against wrongly.

  channel_profiles:
    - name: unilog_delivery
      title_template: "{brand} {product_series} {mpn} {class_name}"
      max_title_chars: 200
      unit_system: imperial_primary
      required: [mpn]
