# Saw blades and hole saws: circular, reciprocating, jigsaw and hole-cutting.
#
# 26 rows of the client's 1,000-row sample, across Diablo, Milwaukee (Hole Dozer) and CMT.
#
# WHY A BLADE IS NOT A SAW. Blades sit in the same kit and the same aisle as the tools that hold
# them, and they are a separate class because none of a saw's attributes answer a blade question.
# A buyer filters a blade on tooth count, arbor shape and tipping material; a saw has none of those,
# and a blade has no battery platform or configuration. Merging them would leave every row in the
# merged class incomplete for lacking specifications it cannot have.
#
# THE SEPARATION FROM POWER TOOLS IS CLEAN IN THIS CATALOGUE, which is worth stating because it is
# luck rather than design. `2834-21HD Milw M18 7-1/4" Circ - Saw Kit` is a saw and says "Saw";
# `D0724X Diablo 7-1/4" 24T Circ Saw Blade` is a blade and says "Blade". The two identity lists do
# not overlap on any row of the sample. If a future file writes "7-1/4 Circ Saw 24T" for a blade,
# this class will lose it to the tool class and the fix is a blade-specific term such as the tooth
# count pattern, not a looser guard.
#
# No description recipe and no external scheme mapping — see decking_board.yaml.

class:
  code: TOL.ACC.SAWBLADE
  name: Saw Blade
  version: v1

  item_type: Saw Blade

  # "dozer" is Milwaukee's hole-saw line and is the only category token on those rows: "49-22-4702
  # Milw 13pc Quik-Lock Hole Dozer Kit" never says blade or saw blade. "dado" is CMT's grooving set.
  identity_terms: [blade, blades, dozer, dado]

  browse_path:
    - Tools & Consumables
    - Tool Accessories
    - Saw Blades

  reporting_path: [Tools, Accessories, Saw Blades]

  attributes:
    - { code: blade_diameter,        requirement: required,    weight: 3.0, label: Diameter }
    - { code: tooth_count,           requirement: required,    weight: 3.0 }
    - { code: blade_material,        requirement: required,    weight: 3.0, label: Tooth Material }
    - { code: arbor_size,            requirement: required,    weight: 3.0, label: Arbor }
    - { code: workpiece_material,    requirement: required,    weight: 3.0, label: For Use On }
    - { code: wheel_thickness,       requirement: optional,    weight: 1.0, label: Kerf }
    - { code: max_operating_speed,   requirement: recommended, weight: 2.0, label: Max RPM }
    - { code: nominal_length,        requirement: optional,    weight: 2.0, label: Length }
    - { code: shank_type,            requirement: optional,    weight: 2.0 }
    - { code: product_series,        requirement: recommended, weight: 2.0, label: Series }
    - { code: pack_quantity,         requirement: recommended, weight: 2.0, label: Piece Count }
    - { code: selling_uom,           requirement: recommended, weight: 2.0 }
    - { code: each_weight,           requirement: optional,    weight: 1.0 }
    - { code: additional_information, requirement: optional,   weight: 1.0 }

    # --- named delivery columns; must stay last ----------------------------------------------
    - { code: warranty_terms,        requirement: optional,    weight: 1.0 }
    - { code: approvals,             requirement: optional,    weight: 1.0 }
    - { code: country_of_origin,     requirement: optional,    weight: 1.0 }
    - { code: prop65_warning_required, requirement: recommended, weight: 2.0 }
    - { code: gtin,                  requirement: optional,    weight: 1.0 }

  cross_field_rules:
    - id: R_KERF_BELOW_DIAMETER
      expr: "wheel_thickness is null or wheel_thickness < blade_diameter"
      references: [wheel_thickness, blade_diameter]
      severity: error
      message: >
        Blade kerf is not less than its diameter, so the two figures were read in the wrong order.
        A circular-blade description states diameter first and kerf later, and both are inch
        figures on the same line.

    - id: R_TOOTHED_BLADE_STATES_A_COUNT
      expr: "blade_material != 'Carbide-Tipped' or tooth_count is not null"
      references: [blade_material, tooth_count]
      severity: warning
      message: >
        A carbide-tipped blade was captured with no tooth count. The count is what a buyer chooses
        between two otherwise identical blades on — 24 teeth rips framing lumber, 80 crosscuts trim
        — so it is a gap worth surfacing rather than an acceptable blank.

  channel_profiles:
    - name: unilog_delivery
      title_template: "{brand} {product_series} {mpn} {class_name}"
      max_title_chars: 200
      unit_system: imperial_primary
      required: [mpn]
