# Protective apparel: gloves, glove liners, heated hoodies and knee pads.
#
# 24 rows of the client's 1,000-row sample, across Milwaukee M12 heated gear, UTW Pro and Aerial Snow.
#
# SIZE IS THE REASON A SKU EXISTS HERE, and no other cohort in this catalogue works that way. Six of
# these rows are one glove:
#
#     UTW Pro Heated Glove Blk XS / SM / MD / LG / XL / 2X
#
# Same brand, same colour, same product, six part numbers. `garment_size` is bound required at the
# heaviest weight, and it is an enum rather than a free string specifically so a buyer's size run can
# be checked for gaps — a missing MD in a six-size run is a stockout the listing should reveal.
#
# THE SIZE-LETTER TRAP, which is the one real hazard in this class. `M200B-21M Milw M12 BLK - Heated
# Hoodie Kit M` contains the letter M three times, meaning three different things: the part number
# suffix, the BATTERY PLATFORM (M12), and the size (the trailing M). `garment_size`'s aliases
# deliberately exclude a bare "m12" and "m18" for this reason, and the extraction hints say to read
# the size from the END of the string. Reading the platform as a size would put every Milwaukee heated
# garment in the same size.
#
# THE HEATED FLAG IS A CATEGORY, NOT A FEATURE. `heated_garment` is bound required because a heated
# garment needs a battery and a platform and costs several times the unheated equivalent. Seventeen of
# these 24 rows are heated, which is why the field earns a required slot rather than a note.
#
# THE RATINGS LIVE IN `approvals`. Cut and impact ratings (ANSI/ISEA 105, EN 388) are compliance
# claims and go through the strict-evidence attribute rather than an ordinary one, so they can never be
# satisfied by inference. See the header of schema/attributes/safety.yaml.
#
# No description recipe and no external scheme mapping — see decking_board.yaml.

class:
  code: SAF.APP.GEN
  name: Protective Apparel
  version: v1

  item_type: Protective Apparel

  # `protector` and `muff` cover hearing protection — "DPG15 Dewalt AM/FM Hearing Protector" is worn
  # PPE whose only category word is Protector. It sits here rather than in a class of its own because
  # one row does not shape a class, and because the attributes a buyer filters it on are the ones this
  # class already binds: form, colour, series and the ANSI listing.
  identity_terms:
    [glove, gloves, liner, liners, hoodie, jacket, vest, apparel, bib, coverall, pad,
     protector, muff]

  browse_path:
    - Safety
    - Personal Protective Equipment
    - Protective Apparel

  reporting_path: [Safety, PPE, Apparel]

  attributes:
    - { code: garment_size,          requirement: required,    weight: 3.0, label: Size }
    - { code: ppe_form,              requirement: required,    weight: 3.0, label: Form }
    - { code: heated_garment,        requirement: required,    weight: 3.0, label: Heated }
    - { code: finish_color,          requirement: required,    weight: 3.0, label: Color }
    - { code: battery_platform,      requirement: recommended, weight: 3.0, label: Platform }
    - { code: battery_voltage,       requirement: optional,    weight: 1.0 }
    - { code: tool_configuration,    requirement: optional,    weight: 2.0, label: Configuration }
    - { code: primary_material,      requirement: recommended, weight: 2.0, label: Material }
    - { code: product_series,        requirement: recommended, weight: 2.0, label: Series }
    - { code: pack_quantity,         requirement: optional,    weight: 1.0 }
    - { code: selling_uom,           requirement: recommended, weight: 2.0 }
    - { code: additional_information, requirement: optional,   weight: 1.0 }

    # --- named delivery columns; must stay last ----------------------------------------------
    - { code: warranty_terms,        requirement: optional,    weight: 1.0 }
    - { code: approvals,             requirement: required,    weight: 3.0 }
    - { code: country_of_origin,     requirement: optional,    weight: 1.0 }
    - { code: prop65_warning_required, requirement: optional,  weight: 1.0 }
    - { code: gtin,                  requirement: optional,    weight: 1.0 }

  cross_field_rules:
    - id: R_HEATED_GARMENT_STATES_A_PLATFORM
      expr: "heated_garment != true or battery_platform is not null"
      references: [heated_garment, battery_platform]
      severity: error
      message: >
        A heated garment was captured with no battery platform. The garment does not work without a
        pack, the pack is platform-specific, and a buyer who owns M18 batteries cannot use an M12
        garment — so the platform is as load-bearing here as it is on a cordless tool.

    - id: R_UNHEATED_GARMENT_HAS_NO_PLATFORM
      expr: "heated_garment == true or battery_platform is null"
      references: [heated_garment, battery_platform]
      severity: error
      message: >
        A battery platform was recorded against an unheated garment. Almost always means the M12 or
        M18 token was read as a platform on a row where it is part of the product name, or — worse —
        that the trailing size letter and the platform were confused.

    - id: R_SIZE_IS_PRESENT
      expr: "garment_size is not null"
      references: [garment_size]
      severity: error
      message: >
        No size was captured. In this cohort the size is the SKU: one glove ships as six part numbers
        differing only by a trailing size token, so a blank here makes six products
        indistinguishable and every one of them unorderable.

  channel_profiles:
    - name: unilog_delivery
      title_template: "{brand} {product_series} {mpn} {class_name}"
      max_title_chars: 200
      unit_system: imperial_primary
      required: [mpn]
