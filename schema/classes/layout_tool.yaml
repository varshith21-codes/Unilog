# Layout and measuring tools: squares, mason line, chalk reels, calipers and lasers.
#
# 24 rows of the client's 1,000-row sample, across Milwaukee, Irwin, Bosch, Wal-Board and the
# mason-line range.
#
# WHY THIS IS SEPARATE FROM HAND TOOLS. A layout tool's whole specification is its range and its
# graduation, and neither is a hand-tool attribute. A 12-inch rafter square and a 300-metre mason
# line share `measurement_range` as their only real spec; a folding knife has no range at all.
# Keeping them apart means `measurement_range` can be required here — which makes the cohort
# filterable — instead of optional across a merged class where most rows would leave it blank.
#
# THE GRADUATION TRAP, which is why `graduation_system` is bound required. `MLSQ0120 Milw 12"
# RafterSquare` and `MLSQ1120 Milw 300mm Rafter - Square (Metric)` are the SAME square stocked in
# two markings, and a metric-only square is unusable on an imperial job. The part numbers differ by
# one digit and the only reliable signal is the explicit "(Metric)" qualifier, so the attribute is
# read from that and never inferred from the figure — 300 mm and 12 inches being the same length is
# exactly why inferring it would look right and be wrong.
#
# A TOKENISER NOTE THAT COST A ROW. "RafterSquare" is written without a space and tokenises to the
# single token `raftersquare`, so neither `rafter` nor `square` matches it. Both spellings are listed
# below. This is the same hyphen-and-compound behaviour that made `r-sheathing` a separate identity
# term on the panel class.
#
# No description recipe and no external scheme mapping — see decking_board.yaml.

class:
  code: TOL.LAY.GEN
  name: Layout and Measuring Tool
  version: v1

  item_type: Layout Tool

  # "mason" carries the mason-line rows, whose only category words are "Mason Line". "bigcal" is a
  # caliper brand line and the only category token on its two rows.
  identity_terms:
    [square, raftersquare, t-square, level, laser, chalk, caliper, bigcal, mason, rafter,
     plumb, protractor, ruler, reel]

  browse_path:
    - Tools & Consumables
    - Hand Tools
    - Layout & Measuring

  reporting_path: [Tools, Hand Tools, Layout & Measuring]

  attributes:
    - { code: measurement_range,     requirement: required,    weight: 3.0, label: Range }
    - { code: graduation_system,     requirement: required,    weight: 3.0, label: Graduation }
    - { code: product_series,        requirement: recommended, weight: 2.0, label: Series }
    - { code: primary_material,      requirement: recommended, weight: 2.0, label: Material }
    - { code: finish_color,          requirement: optional,    weight: 1.0, label: Color }
    - { code: overall_size,          requirement: optional,    weight: 1.0, label: Size }
    - { code: pack_quantity,         requirement: optional,    weight: 1.0, label: Piece Count }
    - { code: each_weight,           requirement: optional,    weight: 1.0 }
    - { code: selling_uom,           requirement: recommended, weight: 2.0 }
    - { code: additional_information, requirement: optional,   weight: 1.0 }

    # --- named delivery columns; must stay last ----------------------------------------------
    - { code: warranty_terms,        requirement: optional,    weight: 1.0 }
    - { code: approvals,             requirement: optional,    weight: 1.0 }
    - { code: country_of_origin,     requirement: optional,    weight: 1.0 }
    - { code: gtin,                  requirement: optional,    weight: 1.0 }

  cross_field_rules:
    - id: R_RANGE_NEEDS_A_GRADUATION
      expr: "measurement_range is null or graduation_system is not null"
      references: [measurement_range, graduation_system]
      severity: error
      message: >
        A measuring range was captured with no graduation system. The same tool is stocked in
        imperial and metric markings under part numbers differing by one digit, and a range figure
        alone does not distinguish them: 300 mm and 12 inches are the same length, which is exactly
        why the marking has to be read rather than inferred.

  channel_profiles:
    - name: unilog_delivery
      title_template: "{brand} {product_series} {mpn} {class_name}"
      max_title_chars: 200
      unit_system: imperial_primary
      required: [mpn]
