# Named constants referenced by cross-field rules.
#
# Kept declarative alongside the rules that use them so a merchandiser can read and correct
# them without touching code. The alternative — burying "which alloys contain lead" in a
# Python set — puts a domain fact where no domain expert will ever find it.

sets:
  # Copper alloys with intentional lead content. A lead-free claim on any of these is
  # contradictory unless a lead-free certification exists for that specific part number.
  # Phrases that withdraw a part rather than describe it.
  #
  # A datasheet that names a part number only to retire it is the hardest targeting case there
  # is, because the part number *is* present: the presence check passes, a model call is made,
  # and every shared specification in the surrounding prose reads as though it applies. The
  # adversarial harness produced a complete, confident, perfectly-cited record for a superseded
  # valve this way — twelve values, twelve verifiable quotes, one part nobody can buy.
  #
  # This lives in YAML because it is a wording question, not a logic question. Manufacturers
  # phrase withdrawal differently and a merchandiser who meets a new phrasing should be able to
  # add it without touching Python.
  WITHDRAWAL_MARKERS:
    - discontinued
    - superseded
    - supersedes
    - obsolete
    - withdrawn
    - "no longer available"
    - "no longer offered"
    - "no longer supplied"
    - "do not order"
    - "not for new design"
    - "replaced by"
    - delisted

  LEADED_ALLOYS:
    - Brass C36000
    - Bronze C84400

  # Alloys formulated as lead-free replacements.
  LEAD_FREE_ALLOYS:
    - Brass C69300
    - Bronze C89833
    - Stainless Steel 316
    - Stainless Steel 304

  # Threaded end connections. Note NPT and BSPT both appear: they are both threaded, and
  # they are still not interchangeable with each other.
  THREADED_TYPES:
    - NPT Threaded
    - BSPT Threaded
    - BSPP Threaded

  # Certifications that substantiate a potable-water claim.
  POTABLE_CERTIFICATIONS:
    - NSF-61
    - NSF-372
    - NSF-14

  # Certifications that substantiate a lead-free claim specifically. NSF-61 is deliberately
  # absent: it covers drinking-water system components, not lead content. Conflating the two
  # is the single most common compliance error in this category.
  LEAD_FREE_CERTIFICATIONS:
    - NSF-372

tables:
  # Metric DN designation to its imperial NPS equivalent, in inches.
  #
  # This is a lookup, not a conversion, and the distinction matters. DN15 and NPS 1/2 name the
  # *same pipe*; the numbers are not arithmetically related (15 mm is 0.59", not 0.5"). Since
  # nominal_size is explicitly a designation rather than a measured bore, DN15 and 1/2" must
  # normalise to one canonical value — otherwise the same physical valve gets two different
  # sizes depending on which market's datasheet described it, and comparison and de-duplication
  # both silently break.
  DN_TO_NPS_INCHES:
    "6": 0.125     # 1/8"
    "8": 0.25      # 1/4"
    "10": 0.375    # 3/8"
    "15": 0.5      # 1/2"
    "20": 0.75     # 3/4"
    "25": 1.0      # 1"
    "32": 1.25     # 1-1/4"
    "40": 1.5      # 1-1/2"
    "50": 2.0      # 2"
    "65": 2.5      # 2-1/2"
    "80": 3.0      # 3"
    "100": 4.0     # 4"
    "125": 5.0     # 5"
    "150": 6.0     # 6"
    "200": 8.0     # 8"
    "250": 10.0    # 10"
    "300": 12.0    # 12"

  # Minimum expected flow coefficient for a full-port valve, by nominal size in millimetres.
  # A full-port valve materially below these figures usually means the Cv was read from a
  # reduced-port row of the same table.
  CV_FLOOR_BY_SIZE_MM:
    "6.35": 3.0     # 1/4"
    "9.525": 6.0    # 3/8"
    "12.7": 10.0    # 1/2"
    "19.05": 22.0   # 3/4"
    "25.4": 40.0    # 1"
    "31.75": 75.0   # 1-1/4"
    "38.1": 110.0   # 1-1/2"
    "50.8": 200.0   # 2"

  # Maximum working pressure by body material, in PSI. A stated rating above the material's
  # limit means either the material or the rating was extracted wrongly.
  MATERIAL_MAX_PRESSURE_PSI:
    Brass C36000: 600.0
    Brass C46500: 600.0
    Brass C69300: 600.0
    Bronze C84400: 600.0
    Bronze C89833: 600.0
    Stainless Steel 304: 1000.0
    Stainless Steel 316: 1000.0
    Carbon Steel: 2000.0
    Ductile Iron: 500.0
    PVC: 150.0

  # Service temperature limits by seat material, in degrees Celsius. The seat is usually the
  # weakest component in the assembly, so it bounds the whole valve.
  SEAT_TEMPERATURE_LIMITS_C:
    PTFE: 232.0
    RPTFE: 232.0
    PEEK: 260.0
    Nylon: 121.0
    Buna-N: 100.0
    EPDM: 149.0
    Metal Seated: 538.0
