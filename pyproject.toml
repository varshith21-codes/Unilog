[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom"
version = "0.1.0"
description = "Verifiable product intelligence for industrial commerce"
requires-python = ">=3.11"
dependencies = [
    # 2.12+ is a floor imposed by the `mcp` extra, not a preference. Raising the base pin rather
    # than letting the extra diverge keeps one pydantic in the tree: two would mean the MCP tool
    # layer validating records against a different model version than the pipeline built them with.
    "pydantic==2.13.4",
    "pyyaml==6.0.2",
    "boto3==1.40.15",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
docintel = [
    # PDF layout extraction. Optional because the text and HTML paths do not need it, and it
    # is the heaviest dependency in the tree. HTML needs nothing: html.parser is stdlib.
    "pdfplumber==0.11.7",
]
ingest = [
    # XLSX reading for supplier flat files. Optional on the same principle as pdfplumber: CSV
    # and TSV go through the csv module, so a deployment that only ever sees delimited files
    # does not need this. `read_flat_file` imports it lazily and only for .xlsx/.xls.
    "openpyxl==3.1.5",
]
api = [
    # 0.141 rather than 0.115 because `mcp` brings starlette 1.x and fastapi 0.115 caps it below
    # 0.42. Both extras have to be installable at once — the review API and the agent surface are
    # two faces of the same catalogue — so the older cap was the thing that had to move.
    "fastapi==0.141.1",
    "uvicorn==0.34.0",
]
mcp = [
    # The MCP server transport. Optional because the tool layer in axiom.agents.tools carries
    # every guarantee and needs no protocol: it is pure functions over records on disk, so CI
    # gates the behaviour without installing this. Only axiom.agents.server imports it, lazily.
    #
    # v2 is a deliberate choice, not the default of picking latest. The v2 line implements the
    # 2026-07-28 spec revision and exposes `MCPServer` with typed tool signatures; v1's
    # `FastMCP` would work but is the older API and would date the integration on arrival.
    "mcp==2.0.0",
]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.7",
    # Required by fastapi.testclient; TestClient drives the app through real ASGI transport.
    "httpx==0.28.1",
    # Generates the synthetic PDFs the docintel tests parse.
    "reportlab==4.2.5",
    # The flat-file tests build a real workbook rather than a fixture, so this is not optional
    # for a test run even though it is optional for the library.
    "openpyxl==3.1.5",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["axiom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repo root on sys.path so the review-workspace tests can import `apps.api.main`.
# `apps` is an application, not a library, so it is deliberately not installed into the venv.
pythonpath = ["packages", "."]
addopts = "-q --strict-markers"
markers = [
    "live: hits real AWS Bedrock endpoints; deselect with -m 'not live'",
]
filterwarnings = [
    "error",
    # reportlab (test-only dependency) uses ast.NameConstant, removed in 3.14.
    "ignore:ast.NameConstant is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
