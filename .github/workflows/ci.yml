# The fast gate. Runs on every push and pull request, needs no credentials, and must stay fast
# enough that nobody is tempted to skip it.
#
# Deliberately split from regression.yml. This job proves the code does what it says; that one
# proves the model pipeline still performs as well as it did, which costs money and needs AWS. A
# single workflow would mean either running the backtest on every typo fix, or having the whole
# gate silently skip on a fork.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push makes an in-flight run redundant. Cancelling keeps queue time honest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.12 is the blueprint's choice; the package declares >=3.11.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # The docintel extra is not optional here even though it is optional in the package: the
        # PDF parsing tests are among the most valuable in the suite, and skipping them in CI
        # would leave the aligned-table reconstruction untested.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docintel,ingest,api]"

      - name: Ruff
        run: python -m ruff check .

      - name: Tests
        # `not live` excludes the tests that hit real Bedrock endpoints. Everything else runs,
        # including the FastAPI routes and the golden-set consistency checks.
        run: python -m pytest -m "not live" --junit-xml=junit.xml

      - name: Schema integrity
        # The registry refuses to load an internally inconsistent schema. Loading it here means a
        # bad YAML edit fails CI even if no test happens to touch that class.
        run: python -c "from axiom.schema import load_default; r = load_default(); print(f'{len(r.attribute_codes)} attributes, {len(r.class_codes)} classes')"

      - name: Console type drift
        # types.ts is a hand-maintained mirror of the Python models, and the failure mode is silent:
        # add an enum member in Python and the console keeps compiling while quietly being unable to
        # represent the new case. `tsc` cannot catch that — it only sees the TypeScript.
        run: python scripts/check_console_types.py --quiet

      - name: Part-number grammar holds its held-out numbers
        # Belongs in the *fast* gate rather than regression.yml, because grammar induction makes no
        # model call: it reads part numbers and ground truth off disk and the rest is arithmetic. So
        # unlike the backtest it needs no credentials, costs nothing, and is reproducible
        # bit-for-bit — there is no reason to run it weekly instead of on every push.
        #
        # The script exits non-zero if the grammar produced a value for an attribute the golden set
        # records as absent. That is the one outcome that must fail a build: a grammar costs nothing
        # to run, so a fabrication rate above zero would scale faster than any review capacity.
        run: python scripts/induce_grammar.py --no-rules

      - name: Cross-reference sweep runs and every attribute is classified
        # Also free and deterministic. The assertion worth making here is not a substitution rate —
        # that is a property of the corpus — but that no attribute reached the comparison without a
        # declared interchange level, since an unclassified attribute is silently excluded from every
        # verdict.
        run: |
          python - <<'PY'
          import sys

          from axiom.resolve import records_from_golden, sweep
          from axiom.schema import load_default

          registry = load_default()
          result = sweep(records_from_golden(registry), registry)

          if result.unclassified():
              print(
                  "FAIL: attributes with no declared interchange level reached a comparison: "
                  + ", ".join(result.unclassified()),
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              f"sweep ok: {result.pairs} ordered pairs, {len(result.comparable())} comparable, "
              f"{len(result.substitutable())} substitutable, "
              f"{len(result.asymmetric_pairs())} asymmetric"
          )
          PY

      - name: Delivery format is byte-identical to the client's
        # The one binary requirement in the whole deliverable. Every other quality measure is a
        # matter of degree — an attribute can be 90% right and still useful. If the columns do not
        # line up with the client's, the file cannot be ingested and the enrichment behind it is
        # worth nothing.
        #
        # Asserted against the client's own CSV rather than a fixture we wrote, because a fixture
        # we wrote would agree with our mistakes. Skips cleanly when the CSV is absent so a fork
        # without the dataset is not blocked, but says so rather than reporting a silent pass.
        run: |
          python - <<'PY'
          import csv
          import sys
          from pathlib import Path

          from axiom.delivery import load_default

          client = Path("Unihack_ Expected Output - Delivery Format.csv")
          if not client.is_file():
              print(f"SKIP: {client} is not in this checkout")
              sys.exit(0)

          with open(client, newline="", encoding="utf-8-sig") as handle:
              theirs = next(csv.reader(handle))
          ours = list(load_default().header)

          if ours != theirs:
              if len(ours) != len(theirs):
                  print(
                      f"FAIL: contract declares {len(ours)} columns, client file has "
                      f"{len(theirs)}",
                      file=sys.stderr,
                  )
              for index, (t, o) in enumerate(zip(theirs, ours)):
                  if t != o:
                      print(
                          f"FAIL: column {index}: client {t!r} != contract {o!r}", file=sys.stderr
                      )
              sys.exit(1)
          print(f"delivery contract ok: {len(ours)} columns, byte-identical")
          PY

      - name: Delivery export scores against ground truth and invents nothing
        # Free and deterministic, so it belongs in the fast gate: the export makes no model call
        # (classification is the retrieval step) and the scorer is arithmetic over two CSVs.
        #
        # The scorer exits non-zero on a hard failure only — an over-filled cell, a breached
        # character limit, or a ground-truth row that produced no output. Missing values do NOT
        # fail the build, because on this dataset they are expected until documents are attached.
        # Over-fill does, because 173 of the client's 252 columns are blank by design and filling
        # one means we invented data. That is the number worth defending on every push.
        run: |
          if [ ! -f "Unihack_ Sample Dataset - Input.csv" ]; then
            echo "SKIP: sample dataset is not in this checkout"
            exit 0
          fi
          python scripts/export_delivery.py "Unihack_ Sample Dataset - Input.csv" \
            --mpn PDSH4816AF --mpn WDTS7024RZ --out data/delivery --quiet
          python scripts/score_delivery.py \
            data/delivery/Unihack__Sample_Dataset_-_Input.delivery.csv

      - name: Document extraction agrees with a human reading and invents nothing
        # The accuracy measurement for the model-free path, gated on every push because it costs
        # nothing: three committed datasheets — one a real PDF — read by layout alone, compared
        # against hand-read ground truth. No credentials, no network, no model.
        #
        # Fails on a disagreement, a fabrication, an unverifiable quote, or a coverage drop below
        # the pinned floor. It also runs a second arm that offers every part all three datasheets,
        # which is the only check that catches the wrong-document failure — values cited to a sheet
        # describing a different product, whose quotes verify perfectly.
        run: python scripts/score_extraction.py --json evals/extraction_score.json

      - name: Deterministic document extraction produces cited values end to end
        # The measurement above scores the extractor in isolation. This one runs it through the
        # actual delivery export, because the two can diverge: a value can be correct and still be
        # dropped by normalisation or projection before it reaches a cell.
        #
        # The assertions are the two that matter here. Cited cells must be produced (a silent zero
        # would mean the wiring broke without the extractor changing), and no cell may cite another
        # product's datasheet.
        run: |
          python scripts/export_delivery.py data/samples/valve-feed.csv \
            --document data/samples/ba100.txt \
            --document data/samples/ap77c.pdf \
            --document data/samples/gv200.txt \
            --out data/delivery/valves --quiet
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sidecar = json.loads(
              Path("data/delivery/valves/valve-feed.provenance.json").read_text(encoding="utf-8")
          )
          expected_source = {
              "BA-100-075": "ba100",
              "77C-105R": "ap77c",
              "T-113-100": "gv200",
          }
          problems = []
          for record in sidecar["records"]:
              mpn = record["mpn"]
              cited = [c for c in record["cells"] if c.get("evidence")]
              if not cited:
                  problems.append(f"{mpn}: no cited cells")
                  continue
              wanted = expected_source[mpn]
              for cell in cited:
                  for reference in cell["evidence"]:
                      # A citation naming another product's datasheet is the wrong-document bug.
                      if any(
                          other in reference
                          for other in expected_source.values()
                          if other != wanted
                      ):
                          problems.append(
                              f"{mpn} {cell['column']} cites {reference!r}, which is not its "
                              f"document ({wanted})"
                          )
              print(f"{mpn}: {len(cited)} cited cells from {wanted}")

          for problem in problems:
              print(f"FAIL: {problem}", file=sys.stderr)
          if problems:
              sys.exit(1)
          PY

      - name: Delivery arm with attributes supplied reproduces the client's row
        # The second measurement, and it answers a different question: given correct extraction,
        # does everything downstream produce the client's row? The golden values are transcribed
        # from their answer sheet, so this proves nothing about extraction and everything about the
        # projection, the unit handling and the five description recipes.
        #
        # Gated in CI for the same reason as the unseeded run: it is the arm where a regression in
        # the description formulas or the magnitude/unit split would actually show up, because the
        # unseeded run has too few facts to exercise them.
        run: |
          if [ ! -f "Unihack_ Sample Dataset - Input.csv" ]; then
            echo "SKIP: sample dataset is not in this checkout"
            exit 0
          fi
          python scripts/export_delivery.py "Unihack_ Sample Dataset - Input.csv" \
            --mpn PDSH4816AF --mpn WDTS7024RZ \
            --golden data/golden/unilog_dishwashers.yaml \
            --out data/delivery/supplied --quiet
          python scripts/score_delivery.py \
            data/delivery/supplied/Unihack__Sample_Dataset_-_Input.delivery.csv

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: junit.xml
          if-no-files-found: warn

  console:
    name: console typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22, not 20. Node 20 reached end-of-life on 2026-04-30, so it receives no security
          # patches — reason enough on its own for a build that ships to a client. It was also
          # breaking the suite outright: every one of the nine test files died with
          # "[vitest-pool]: Failed to start forks worker" before running a single assertion, while
          # the same commit passed 122 tests locally on 22.17.1. A worker pool that cannot spawn
          # reports as a test failure, which sent the whole build red for a runtime problem.
          #
          # Pinned to the major the code is actually verified against rather than the newest
          # available, and declared in apps/console/package.json `engines` so the constraint lives
          # with the package instead of only in this file.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - run: npm ci

      - name: Typecheck
        # types.ts is a hand-maintained mirror of the Python models, so this is the only thing
        # standing between a renamed field and a runtime crash in the console.
        run: npm run typecheck

      - name: Tests
        # `tsc` proves the types line up. It cannot prove that a panel reporting "no contradiction"
        # would still say so when the solver returned an error — and several components here exist
        # specifically to keep two similar-looking states apart, which is where the risk is.
        run: npm test

      - name: Contrast
        # Accessibility is a build failure, not a review comment. The script checks every
        # foreground/background pair in the theme against the WCAG ratios.
        run: npm run check:contrast

      # Python, in the console job, for one reason: `next build` statically generates
      # /review/[sku] and /certificates/[sku], so it needs real data at build time. Without it the
      # build fails on "Could not reach the AXIOM API ... and no offline fixture exists".
      #
      # The fixture is generated rather than committed. It is 374 KB of pipeline output whose
      # certificates are re-signed and timestamped on every run, so committing it would put a
      # ten-thousand-line diff in front of a reviewer for any change that touched it. Generating
      # costs about a minute and buys real signal instead: the script drives the actual pipeline —
      # ingest, parse, classify, extract, normalize, validate, score, certify — so this step also
      # proves those stages still compose. It uses StubModelClient, so no credentials and no
      # network.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Offline fixture for static generation
        # working-directory overrides the job default: this runs at the repo root, not in the
        # console.
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docintel,ingest]"
          python scripts/export_console_fixture.py

      - name: Build
        run: npm run build

  gate-config:
    name: regression baseline is intact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"

      # The regression gate itself needs AWS to measure anything, but its *configuration* can be
      # checked for free — and a broken or baselined-to-the-ablation-arm config would make the
      # real gate pass vacuously. This is the guard on the guard.
      - name: Baseline is present, well-formed, and on the treatment arm
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          from axiom.evaluation import TRACKED, check_regression

          baseline = json.loads(Path("evals/baseline.json").read_text(encoding="utf-8"))
          problems = []

          if baseline.get("arm") != "axiom":
              problems.append(
                  f"baseline arm is {baseline.get('arm')!r}; the no-evidence-contract arm is the "
                  f"ablation control group and baselining against it inverts the gate"
              )
          if baseline.get("enforce_evidence") is not True:
              problems.append("baseline was measured with the evidence contract disabled")
          if baseline.get("hallucinated") not in (0, 0.0):
              problems.append(
                  f"baseline records {baseline.get('hallucinated')} hallucinations; that is not a "
                  f"number to normalise"
              )

          missing = sorted({g.metric for g in TRACKED} - set(baseline))
          if missing:
              problems.append(f"baseline is missing tracked metrics: {', '.join(missing)}")

          # A baseline must judge itself clean, or the gate can never pass.
          report = check_regression(baseline, baseline)
          if not report.passed:
              problems.append(
                  "the baseline does not pass its own gate: "
                  + "; ".join(c.reason for c in report.comparisons if c.verdict.blocks)
                  + "".join(f" {r}" for r in report.fatal)
              )

          for problem in problems:
              print(f"FAIL: {problem}", file=sys.stderr)
          if problems:
              sys.exit(1)
          print(
              f"baseline ok: {baseline['golden_set']} arm={baseline['arm']} "
              f"prompt={baseline.get('prompt_version')} "
              f"({len(TRACKED)} tracked metrics)"
          )
          PY
